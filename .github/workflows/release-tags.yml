
name: Release tagged build


on:
  push:
    tags: ['*']


permissions:
  contents: write

jobs:
  build-and-release:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'


      - name: Set up JDK 21 (Zulu)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'zulu'


      - name: Grant execute permission for gradlew
        run: chmod +x gradlew


      - name: Build with Gradle
        run: ./gradlew build


      - name: Prepare main mod release
        id: version
        run: |
          TIMESTAMP=$(TZ=Asia/Singapore date +'%d/%m/%Y %H:%M:%S')
          TAG="$GITHUB_REF_NAME"
          JAR="build/libs/schematica_plus-${TAG}.jar"
          test -f "$JAR"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"


      - name: Read README
        id: readme
        run: |
          {
            echo "content<<EOF"
            cat README.md
            echo ""
            echo "EOF"
          } >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.version.outputs.jar }}
          name: "${{ steps.version.outputs.tag }} (${{ steps.version.outputs.timestamp }})"
          body: |
            ## Schematica-Plus ${{ steps.version.outputs.tag }}

            Build Time: ${{ steps.version.outputs.timestamp }} (UTC+8)

            ---
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          generate_release_notes: true
